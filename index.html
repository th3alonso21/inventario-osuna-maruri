<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D2A33">
<title>Inventario Osuna Maruri</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='6' fill='%231D2A33'/%3E%3Crect x='20' y='26' width='24' height='12' rx='3' fill='%23F2C230'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#E7EAEC;      /* fondo: lámina galvanizada */
  --sheet:#FFFFFF;      /* superficies */
  --ink:#1D2A33;        /* texto y barra */
  --muted:#5E6B74;
  --line:#D3D9DD;
  --blue:#1F5FAD;       /* acciones */
  --blue-soft:#E3ECF7;
  --tag:#F2C230;        /* etiqueta amarilla: marca y avisos de poco stock */
  --tag-soft:#FDF4D3;
  --out:#B42318;
  --out-soft:#FBE7E5;
  --ok:#1E7A46;
  --ok-soft:#E2F2E8;
  --r-sm:6px; --r:10px; --r-lg:16px;
  --shadow:0 1px 0 rgba(29,42,51,.06), 0 6px 20px -12px rgba(29,42,51,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Archivo',system-ui,sans-serif; font-variation-settings:'wdth' 100;
  background:var(--steel); color:var(--ink); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.wide{font-variation-settings:'wdth' 118}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Pantallas de acceso ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 12px 12px, rgba(29,42,51,.13) 2px, transparent 2.5px) 0 0/24px 24px,
    var(--steel);}
.gate-card{background:var(--sheet);border-radius:var(--r-lg);padding:32px 28px;max-width:400px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line)}
.gate-card h1{font-size:30px;line-height:1.05;margin:18px 0 8px;font-weight:800;font-variation-settings:'wdth' 120;letter-spacing:-.01em}
.gate-card p{color:var(--muted);margin:0 0 22px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:30px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.logo-mark i{display:block;width:16px;height:8px;border-radius:3px;background:var(--tag)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);font-weight:600}
.gbtn:hover{border-color:var(--ink)}
.gate-note{font-size:13px;color:var(--muted);margin-top:16px}

/* ---------- Estructura ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.brand .logo-mark{background:#2E3E49}
.brand b{font-weight:800;font-size:17px;font-variation-settings:'wdth' 115;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b span{font-weight:500;opacity:.75}
nav.tabs{display:flex;gap:4px;margin-left:12px}
nav.tabs a{color:#C9D2D8;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px}
nav.tabs a:hover{color:#fff;background:#2A3A45}
nav.tabs a.on{color:var(--ink);background:#fff}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:9px;border:0;background:#2A3A45;color:#fff;display:grid;place-items:center}
.icon-btn:hover{background:#364A57}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--tag);color:var(--ink);font-size:11.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--ink)}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--tag);color:var(--ink);font-weight:800;overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
main{max-width:1120px;margin:0 auto;padding:22px 20px 110px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{margin:0;font-size:28px;font-weight:800;font-variation-settings:'wdth' 120;letter-spacing:-.01em;line-height:1.1}
.page-h p{margin:4px 0 0;color:var(--muted)}

nav.bottom{display:none}
@media (max-width:760px){
  nav.tabs{display:none}
  .brand b span{display:none}
  .top-in{padding:8px 14px;min-height:54px}
  main{padding:16px 14px 110px}
  .page-h h1{font-size:24px}
  nav.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:8px}
  nav.bottom a svg{width:22px;height:22px}
  nav.bottom a.on{color:var(--blue);background:var(--blue-soft)}
}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:var(--r);border:1px solid transparent;font-weight:650;font-size:14.5px;white-space:nowrap;background:var(--sheet);border-color:var(--line);color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#184C8B}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--out);border-color:#EBC3BF;background:#fff}
.btn.danger:hover{border-color:var(--out)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin-bottom:14px}
.field label{display:block;font-weight:650;font-size:13.5px;margin-bottom:5px}
.field label small{font-weight:500;color:var(--muted)}
.input,.select,.textarea{width:100%;padding:11px 12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-size:15px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}}
.with-add{display:flex;gap:6px}
.with-add .select{flex:1}
.with-add .btn{padding:0 12px}
.help{font-size:13px;color:var(--muted);margin-top:5px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px}
.chip .n{font-size:12px;color:var(--muted);font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on .n{color:#C9D2D8}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet)}
.toggle.on{background:var(--tag-soft);border-color:var(--tag)}

/* ---------- Inventario: cajones ---------- */
.drawer{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px;overflow:hidden}
.drawer-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#F6F8F9}
.drawer-label{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 11px 5px 9px;font-weight:750;font-size:15px;font-variation-settings:'wdth' 112}
.drawer-label::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--steel);box-shadow:inset 0 0 0 1.5px #A9B4BB}
.drawer-sub{color:var(--muted);font-size:13.5px}
.drawer-warn{margin-left:auto;font-size:12.5px;font-weight:700;color:#7A5A00;background:var(--tag-soft);border:1px solid #EBD487;border-radius:999px;padding:3px 10px;white-space:nowrap}
.item-row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid #EDF0F2;cursor:pointer}
.item-row:last-child{border-bottom:0}
.item-row:hover{background:#FAFBFC}
.thumb{width:52px;height:52px;border-radius:9px;background:var(--steel);flex-shrink:0;overflow:hidden;display:grid;place-items:center;font-size:22px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item-main{flex:1;min-width:0}
.item-name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:baseline;gap:4px;flex-shrink:0;min-width:64px;justify-content:flex-end}
.qty b{font-size:21px;font-weight:800;font-variation-settings:'wdth' 110}
.qty span{font-size:12.5px;color:var(--muted)}
.flag{display:inline-block;font-size:11.5px;font-weight:750;border-radius:5px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.flag.low{background:var(--tag-soft);color:#7A5A00;border:1px solid #EBD487}
.flag.out{background:var(--out-soft);color:var(--out);border:1px solid #F0C6C1}
.quick{display:flex;gap:4px;flex-shrink:0}
.quick button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center}
.quick button:hover{border-color:var(--ink)}
@media (max-width:560px){.quick{display:none}.thumb{width:46px;height:46px}}

.empty{text-align:center;padding:48px 20px;background:var(--sheet);border:1px dashed #BCC6CC;border-radius:var(--r-lg)}
.empty h3{margin:0 0 6px;font-size:19px;font-variation-settings:'wdth' 112}
.empty p{color:var(--muted);margin:0 auto 16px;max-width:420px}

/* ---------- Tarjetas genéricas ---------- */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:19px;font-variation-settings:'wdth' 115;font-weight:800}
.panel > p.lead{margin:0 0 14px;color:var(--muted);font-size:14px}

/* ---------- Alta rápida ---------- */
.quick-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.quick-wrap{grid-template-columns:1fr}}
.photo-drop{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.photo-box{width:96px;height:96px;border-radius:12px;background:var(--steel);border:2px dashed #AEB9C0;display:grid;place-items:center;overflow:hidden;flex-shrink:0;color:var(--muted)}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-btns{display:flex;flex-direction:column;gap:8px}
.context-strip{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px 16px 4px;margin-bottom:14px}
.context-strip .field label{color:#C9D2D8}
.context-strip .select{background:#2A3A45;border-color:#3A4D5A;color:#fff}
.context-strip .btn{background:#2A3A45;border-color:#3A4D5A;color:#fff}
.dupe{background:var(--blue-soft);border:1px solid #BCD0EA;border-radius:var(--r);padding:10px 12px;margin:-4px 0 14px;font-size:14px}
.dupe-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #CFDDEF}
.dupe-row:first-of-type{border-top:0}
.dupe-row .item-main{font-size:14px}
details.more{border-top:1px solid var(--line);margin:4px 0 14px;padding-top:10px}
details.more summary{cursor:pointer;font-weight:650;color:var(--blue);padding:4px 0 10px}
.session-list{list-style:none;margin:0;padding:0}
.session-list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EDF0F2;font-size:14px}
.session-list li:last-child{border-bottom:0}
.session-list .thumb{width:36px;height:36px;font-size:16px;border-radius:7px}

/* ---------- Movimientos ---------- */
.day{font-weight:800;font-size:14px;color:var(--muted);margin:18px 0 8px;font-variation-settings:'wdth' 112}
.mv{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:6px}
.mv-badge{flex-shrink:0;width:44px;text-align:center;font-weight:800;font-size:15px;border-radius:7px;padding:5px 0}
.mv-badge.in{background:var(--ok-soft);color:var(--ok)}
.mv-badge.outb{background:var(--out-soft);color:var(--out)}
.mv-badge.adj{background:var(--blue-soft);color:var(--blue)}
.mv-badge.del{background:#EEF0F2;color:var(--muted)}
.mv-text{flex:1;min-width:0;font-size:14.5px}
.mv-text .sub{color:var(--muted);font-size:13px}
.mv-time{color:var(--muted);font-size:12.5px;flex-shrink:0}

/* ---------- Configuración ---------- */
.cfg-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cfg-grid{grid-template-columns:1fr}}
.furn{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.furn-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#F6F8F9;border-bottom:1px solid var(--line)}
.furn-h b{flex:1;font-size:15.5px}
.loc{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #EDF0F2;font-size:14.5px}
.loc:last-child{border-bottom:0}
.loc span{flex:1}
.loc .cnt{flex:0;color:var(--muted);font-size:12.5px;white-space:nowrap}
.mini{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini:disabled{opacity:.35;cursor:default}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EDF0F2}
.list-row:last-child{border-bottom:0}
.list-row .emo{width:32px;height:32px;border-radius:8px;background:var(--steel);display:grid;place-items:center;font-size:17px}
.list-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---------- Modales ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(17,25,31,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .15s ease}
.overlay.top{z-index:60}
@keyframes fade{from{opacity:0}}
.modal{background:var(--sheet);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);animation:rise .18s ease}
.modal.sm{max-width:400px}
@keyframes rise{from{transform:translateY(10px);opacity:.6}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:19px;font-weight:800;flex:1;font-variation-settings:'wdth' 112}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px 6px;border-radius:6px}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:560px){
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:94vh;overflow-y:auto}
  .overlay.top{align-items:center;padding:16px}
  .overlay.top .modal{border-radius:var(--r-lg)}
}
.detail-photo{width:100%;aspect-ratio:4/3;border-radius:var(--r);background:var(--steel);overflow:hidden;display:grid;place-items:center;font-size:48px;margin-bottom:14px}
.detail-photo img{width:100%;height:100%;object-fit:contain;background:#DDE2E5}
.detail-qty{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.detail-qty b{font-size:38px;font-weight:800;line-height:1;font-variation-settings:'wdth' 112}
.detail-qty small{color:#C9D2D8;font-size:14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14.5px;margin-bottom:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.mvbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:700}
.stepper input{width:80px;text-align:center;font-size:20px;font-weight:800}
.hist{list-style:none;padding:0;margin:0;font-size:13.5px}
.hist li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #EDF0F2}
.hist li:last-child{border-bottom:0}
.hist .d{color:var(--muted);white-space:nowrap}

/* popover alertas / usuario */
.pop{position:fixed;top:62px;right:16px;z-index:40;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 20px 50px -20px rgba(0,0,0,.4);width:min(360px,calc(100vw - 32px));max-height:70vh;overflow-y:auto}
.pop-h{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;font-variation-settings:'wdth' 112}
.pop-row{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid #EDF0F2;cursor:pointer}
.pop-row:hover{background:#FAFBFC}
.pop-row:last-child{border-bottom:0}

.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (min-width:761px){.toast-wrap{bottom:24px}}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:rise .18s ease;max-width:90vw}
.toast.err{background:var(--out)}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div>Cargando…</div></div></div>
<div class="toast-wrap" id="toasts"></div>

<script type="module">
/* =====================================================================
   Inventario Osuna Maruri
   Datos en Firebase Firestore (tiempo real), acceso con cuenta de Google.
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const safeImg = s => (typeof s === 'string' && s.startsWith('data:image/')) ? s : '';
const money = n => (Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const ls = { get(k,d){ try{ const v=localStorage.getItem('iom:'+k); return v==null?d:JSON.parse(v);}catch(e){return d} }, set(k,v){ try{localStorage.setItem('iom:'+k, JSON.stringify(v))}catch(e){} } };
const tsDate = t => (t && typeof t.toDate === 'function') ? t.toDate() : new Date();
const firstName = u => (u?.displayName || u?.email || 'Alguien').split(/[\s@]/)[0];
const fmtTime = d => d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
function fmtDay(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const diff = Math.round((today - dd)/86400000);
  if(diff===0) return 'Hoy';
  if(diff===1) return 'Ayer';
  const s = d.toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'long', year: d.getFullYear()!==today.getFullYear()?'numeric':undefined});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast'+(err?' err':'');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, err?4200:2400);
}
function errMsg(e){
  const c = e && (e.code || e.message || '');
  if(String(c).includes('permission-denied')) return 'Tu cuenta no tiene permiso para hacer esto.';
  if(String(c).includes('unavailable')) return 'Sin conexión. Se guardará cuando vuelva el internet.';
  return (e && e.message) ? e.message : 'Algo salió mal. Intenta de nuevo.';
}

async function login(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  try{ await signInWithPopup(auth, provider); }
  catch(e){
    if(e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment'){
      await signInWithRedirect(auth, provider);
    }else if(e.code!=='auth/popup-closed-by-user' && e.code!=='auth/cancelled-popup-request'){
      renderLogin('No se pudo iniciar sesión: '+(e.code||e.message));
    }
  }
}

/* Primera vez: categorías de ejemplo, un mueble y la lista de acceso */
async function ensureSeed(){
  const metaRef = doc(db,'config','meta');
  const meta = await getDoc(metaRef);
  if(meta.exists()) return;
  const b = writeBatch(db);
  DEFAULT_CATEGORIES.forEach(c=> b.set(doc(collection(db,'categories')), {...c, createdAt:serverTimestamp()}));
  b.set(doc(collection(db,'furniture')), {name:'Mueble principal', description:'', order:0, createdAt:serverTimestamp()});
  b.set(doc(db,'config','access'), {emails:[OWNER_EMAIL]}, {merge:true});
  b.set(metaRef, {seededAt:serverTimestamp(), seededBy:S.user.email});
  await b.commit();
}

/* ---------------- Suscripciones en tiempo real ---------------- */
function subscribeAll(){
  const sub = (key, q, map) => {
    S.unsubs.push(onSnapshot(q, snap=>{
      S[key] = map ? map(snap) : snap.docs.map(d=>({id:d.id, ...d.data()}));
      S.loaded.add(key);
      onData(key);
    }, err=>{ console.error(key, err); toast('Error al cargar '+key+': '+errMsg(err), true); }));
  };
  sub('furniture', collection(db,'furniture'));
  sub('locations', collection(db,'locations'));
  sub('categories', collection(db,'categories'));
  sub('items', collection(db,'items'));
  sub('movements', query(collection(db,'movements'), orderBy('at','desc'), limit(400)));
  S.unsubs.push(onSnapshot(doc(db,'config','access'), d=>{ S.access = d.exists()? d.data() : {emails:[]}; S.loaded.add('access'); onData('access'); }));
}
const REQUIRED = ['furniture','locations','categories','items'];
let renderQueued = false;
function onData(key){
  if(!REQUIRED.every(k=>S.loaded.has(k))) return;
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued=false; refresh(key); });
}

  if(!S.user) return;
  if(!REQUIRED.every(k=>S.loaded.has(k))) return; // se dibuja cuando lleguen los datos

}

function refresh(key){

  else if(S.view==='config' && !document.activeElement?.closest?.('#view input')) renderConfig();

}

/* ---------------- Popovers (avisos / cuenta) ---------------- */
function closePop(){ $$('.pop').forEach(p=>p.remove()); }
document.addEventListener('click', e=>{ if(!e.target.closest('.pop')) closePop(); });
function togglePop(kind, rerender){
  const existing = $('.pop');
  if(existing && existing.dataset.kind===kind && !rerender){ closePop(); return; }
  closePop();
  const p = document.createElement('div');
  p.className='pop'; p.dataset.kind=kind;
  if(kind==='alerts'){
    const list = S.items.filter(needsAttention).sort((a,b)=>a.quantity-b.quantity);
    p.innerHTML = `<div class="pop-h">Queda poco (${list.length})</div>` + (list.length ? list.map(it=>`
      <div class="pop-row" data-open="${it.id}">
        <div class="thumb" style="width:38px;height:38px;font-size:17px;border-radius:7px">${thumbHtml(it)}</div>
        <div class="item-main"><div class="item-name" style="font-size:14.5px">${esc(it.name)}</div><div class="item-meta">${esc(furnName(it.furnitureId))} › ${esc(locName(it.locationId))}</div></div>
        <div class="qty"><b style="font-size:17px" class="num">${it.quantity}</b><span>/ mín. ${it.minStock}</span></div>
      </div>`).join('') : `<div style="padding:16px 14px;color:var(--muted);font-size:14px">Nada por reponer. Los avisos aparecen cuando un artículo llega a su cantidad mínima.</div>`);
  }else{
    p.innerHTML = `<div class="pop-h">${esc(S.user.displayName||'Tu cuenta')}</div>
      <div style="padding:12px 14px;font-size:14px;color:var(--muted)">${esc(S.user.email)}</div>
      <div style="padding:0 14px 14px"><button class="btn block" id="logout">Cerrar sesión</button></div>
      <div style="padding:0 14px 12px;font-size:12px;color:var(--muted)">Versión ${APP_VERSION}</div>`;
  }
  p.addEventListener('click', e=>{
    e.stopPropagation();
    const o = e.target.closest('[data-open]');
    if(o){ closePop(); openDetail(o.dataset.open); }
    if(e.target.id==='logout'){ signOut(auth); }
  });
  document.body.appendChild(p);
}

function renderInventoryList(){
  if(!$('#inv-list')) return;
  // chips de muebles
  const furns = sortedFurniture();
  $('#furn-chips').innerHTML = [{id:'all',name:'Todos los muebles'}, ...furns].map(f=>{
    const n = f.id==='all' ? S.items.length : S.items.filter(i=>i.furnitureId===f.id).length;
    return `<button class="chip ${S.ui.furn===f.id?'on':''}" data-f="${f.id}">${esc(f.name)} <span class="n num">${n}</span></button>`;
  }).join('');
  // categorías
  const catSel = $('#inv-cat');
  catSel.innerHTML = `<option value="">Todas las categorías</option>` + sortedCats().map(c=>`<option value="${c.id}" ${S.ui.cat===c.id?'selected':''}>${esc(c.emoji||'')} ${esc(c.name)}</option>`).join('');

  let list = S.items.slice();
  if(S.ui.furn!=='all') list = list.filter(i=>i.furnitureId===S.ui.furn);
  if(S.ui.cat) list = list.filter(i=>i.categoryId===S.ui.cat);
  if(S.ui.low) list = list.filter(needsAttention);
  const q = norm(S.ui.q);
  if(q) list = list.filter(i=>norm([i.name,i.brand,i.spec,i.serial,i.notes,catLabel(i.categoryId)].join(' ')).includes(q));
  list.sort((a,b)=>a.name.localeCompare(b.name,'es'));

  const total = S.items.filter(i=>S.ui.furn==='all'||i.furnitureId===S.ui.furn);
  const alerts = total.filter(needsAttention).length;
  $('#inv-summary').textContent = `${total.length} artículo${total.length===1?'':'s'}${alerts?` · ${alerts} por reponer`:''}`;

  const box = $('#inv-list');
  if(!S.items.length){
    box.innerHTML = `<div class="empty"><h3>Todavía no hay nada registrado</h3><p>Abre el mueble y empieza a dar de alta lo que encuentres: foto, nombre y cantidad. Queda acomodado por cajón y categoría.</p><a class="btn primary" href="#/alta">${ICONS.plus} Empezar a dar de alta</a></div>`;
    return;
  }
  if(!list.length){
    box.innerHTML = `<div class="empty"><h3>Sin resultados</h3><p>Ningún artículo coincide con la búsqueda o los filtros. Prueba con otra palabra o quita los filtros.</p></div>`;
    return;
  }
  // Agrupar
  const groups = new Map();
  for(const it of list){
    let key, title, sub;
    if(S.ui.groupBy==='cat'){
      key = it.categoryId||'none'; title = `${catEmoji(it.categoryId)} ${catLabel(it.categoryId)}`; sub = '';
    }else{
      key = (it.furnitureId||'')+'|'+(it.locationId||'');
      title = locName(it.locationId);
      sub = S.ui.furn==='all' ? furnName(it.furnitureId) : '';
    }
    if(!groups.has(key)) groups.set(key, {title, sub, items:[], sortKey: groupSortKey(it)});
    groups.get(key).items.push(it);
  }
  const ordered = [...groups.values()].sort((a,b)=> a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0);
  box.innerHTML = ordered.map(g=>{
    const warn = g.items.filter(needsAttention).length;
    return `<section class="drawer">
      <div class="drawer-h">
        <span class="drawer-label">${esc(g.title)}</span>
        <span class="drawer-sub">${g.sub?esc(g.sub)+' · ':''}${g.items.length} artículo${g.items.length===1?'':'s'}</span>
        ${warn?`<span class="drawer-warn">⚠ ${warn} por reponer</span>`:''}
      </div>
      ${g.items.map(itemRowHtml).join('')}
    </section>`;
  }).join('');
}
function groupSortKey(it){
  if(S.ui.groupBy==='cat') return norm(catLabel(it.categoryId));
  const furns = sortedFurniture();
  const fi = furns.findIndex(f=>f.id===it.furnitureId);
  const locs = locsOf(it.furnitureId);
  const li = locs.findIndex(l=>l.id===it.locationId);
  return String(fi<0?999:fi).padStart(4,'0')+'-'+String(li<0?999:li).padStart(4,'0');
}
function itemRowHtml(it){
  const meta = [it.brand, it.spec, S.ui.groupBy==='cat' ? `${furnName(it.furnitureId)} › ${locName(it.locationId)}` : catLabel(it.categoryId)].filter(Boolean).join(' · ');
  return `<div class="item-row" data-item="${it.id}">
    <div class="thumb">${thumbHtml(it)}</div>
    <div class="item-main">
      <div class="item-name">${esc(it.name)}${flagHtml(it)}</div>

}

/* ---------------- Movimientos de cantidad (entrada / salida) ---------------- */
async function recordMovement(itemId, type, qty, note){
  qty = Math.floor(Number(qty));
  if(!(qty>0)) throw new Error('La cantidad debe ser mayor a 0.');
  const itemRef = doc(db,'items',itemId);
  const mvRef = doc(collection(db,'movements'));
  await runTransaction(db, async tx=>{
    const snap = await tx.get(itemRef);
    if(!snap.exists()) throw new Error('Este artículo ya no existe.');
    const it = snap.data();
    const before = Number(it.quantity)||0;
    const after = type==='salida' ? before - qty : before + qty;
    if(after < 0) throw new Error(`Solo hay ${before} ${it.unit||'pza'}. No puedes sacar ${qty}.`);
    tx.update(itemRef, {quantity:after, updatedAt:serverTimestamp(), updatedBy:S.user.email});
    tx.set(mvRef, movementDoc(itemId, it, type, qty, before, after, note));
  });
}
function movementDoc(itemId, it, type, qty, before, after, note){
  return {
    itemId, itemName: it.name, categoryId: it.categoryId||'', furnitureId: it.furnitureId||'', locationId: it.locationId||'',
    unit: it.unit||'pza', type, qty, before, after, note: note||'',
    byEmail: S.user.email, byName: S.user.displayName || S.user.email, at: serverTimestamp(),
  };
}

      <div class="field"><label>Nota <small>(opcional)</small></label><input class="input" id="qm-note" placeholder="${isOutType?'p. ej. para la lámpara del cuarto':'p. ej. compra en Home Depot'}"></div>
    </div>

function stepperHtml(id, val=1){
  return `<div class="stepper"><button type="button" data-step="-1" aria-label="Menos">−</button><input class="input num" id="${id}" type="number" inputmode="numeric" min="1" value="${val}"><button type="button" data-step="1" aria-label="Más">+</button></div>`;
}
function bindStepper(root, id){
  const inp = $('#'+id, root);
  $$('[data-step]', inp.parentElement).forEach(b=>b.onclick=()=>{ inp.value = Math.max(1,(parseInt(inp.value)||0)+Number(b.dataset.step)); });
}

/* ---------------- Modales ---------------- */
function openModal(html, opts={}){
  const o = document.createElement('div');
  o.className = 'overlay'+(opts.top?' top':'');
  o.innerHTML = `<div class="modal ${opts.sm?'sm':''}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e=>{ if(e.target===o) closeModal(o); });
  o.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeModal(o); });
  document.body.appendChild(o);
  document.body.style.overflow='hidden';
  return o;
}
function closeModal(o){
  if(o && o.dataset.detail){ S.openItemId=null; }
  o?.remove();
  if(!$('.overlay')) document.body.style.overflow='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const all=$$('.overlay'); if(all.length) closeModal(all[all.length-1]); } });
function askText(title, {placeholder='', value='', okLabel='Guardar', label=''}={}){
  return new Promise(res=>{
    const m = openModal(`<div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><div class="field" style="margin:0">${label?`<label>${esc(label)}</label>`:''}<input class="input" id="ask-in" placeholder="${esc(placeholder)}" value="${esc(value)}"></div></div>
      <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ask-ok">${esc(okLabel)}</button></div>`, {sm:true, top:true});
    const inp = $('#ask-in',m); setTimeout(()=>{inp.focus(); inp.select();},50);
    const done = v=>{ closeModal(m); res(v); };
    $('#ask-ok',m).onclick = ()=>{ const v=inp.value.trim(); if(v) done(v); else inp.focus(); };
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#ask-ok',m).click(); } });
    m.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) res(null); });
  });
}
function askConfirm(title, text, {okLabel='Confirmar', danger=false}={}){
  return new Promise(res=>{
    const m = openModal(`<div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-close>×</button></div>
      <div class="modal-b"><p style="margin:0">${text}</p></div>
      <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn ${danger?'danger':'primary'}" id="cf-ok">${esc(okLabel)}</button></div>`, {sm:true, top:true});
    $('#cf-ok',m).onclick = ()=>{ closeModal(m); res(true); };
    m.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) res(false); });
  });
}

/* ---------------- Fotos: se comprimen en el dispositivo ---------------- */
function loadImage(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
function toDataUrl(img, maxDim, quality){
  const scale = Math.min(1, maxDim/Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth*scale)), h = Math.max(1, Math.round(img.naturalHeight*scale));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg', quality);
}
function squareThumb(img, size=160){
  const s = Math.min(img.naturalWidth, img.naturalHeight);
  const c = document.createElement('canvas'); c.width=size; c.height=size;
  c.getContext('2d').drawImage(img, (img.naturalWidth-s)/2, (img.naturalHeight-s)/2, s, s, 0, 0, size, size);
  return c.toDataURL('image/jpeg', 0.65);
}
async function processPhoto(file){
  const img = await loadImage(file);
  let full = toDataUrl(img, 1100, 0.72);
  if(full.length > 850000) full = toDataUrl(img, 900, 0.6);
  if(full.length > 850000) full = toDataUrl(img, 700, 0.55);
  return { full, thumb: squareThumb(img) };
}

        <div class="photo-box" id="e-photo">${safeImg(it.thumb)?`<img src="${safeImg(it.thumb)}" alt="">`:ICONS.camera}</div>
        <div class="photo-btns">
          <label class="btn sm">Cambiar foto<input type="file" accept="image/*" id="e-file" hidden></label>
          ${it.hasPhoto?'<button class="btn sm" id="e-rm" type="button">Quitar foto</button>':''}
        </div>
      </div>
      ${itemFieldsHtml(it)}
    </div>
    <div class="modal-f"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="e-ok">Guardar cambios</button></div>`, {top:true});
  bindContextSelects(m);
  $('#e-file',m).onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{ newPhoto = await processPhoto(f); removePhoto=false; $('#e-photo',m).innerHTML = `<img src="${newPhoto.thumb}" alt="">`; }
    catch(err){ toast(errMsg(err), true); }
  };
  const rm = $('#e-rm',m);
  if(rm) rm.onclick = ()=>{ removePhoto=true; newPhoto=null; $('#e-photo',m).innerHTML = ICONS.camera; };
  $('#e-ok',m).onclick = async ()=>{
    const p = readItemFields(m);
    const err = validateItem(p); if(err){ toast(err,true); return; }
    const btn=$('#e-ok',m); btn.disabled=true;
    try{
      const itemRef = doc(db,'items',itemId);
      await runTransaction(db, async tx=>{
        const snap = await tx.get(itemRef);
        if(!snap.exists()) throw new Error('Este artículo ya no existe.');
        const cur = snap.data();
        const upd = {...p, updatedAt:serverTimestamp(), updatedBy:S.user.email};
        if(newPhoto){ upd.thumb=newPhoto.thumb; upd.hasPhoto=true; tx.set(doc(db,'photos',itemId), {data:newPhoto.full}); }
        if(removePhoto){ upd.thumb=''; upd.hasPhoto=false; tx.delete(doc(db,'photos',itemId)); }
        tx.update(itemRef, upd);
        const before = Number(cur.quantity)||0;
        if(before !== p.quantity){
          tx.set(doc(collection(db,'movements')), movementDoc(itemId, {...cur, ...p}, 'ajuste', Math.abs(p.quantity-before), before, p.quantity, 'Ajuste desde Editar'));
        }
      });
      closeModal(m); toast('Cambios guardados');
      if(newPhoto){ const box=$('#detail-photo'); if(box) box.innerHTML=`<img src="${newPhoto.full}" alt="">`; }
    }catch(e){ toast(errMsg(e), true); btn.disabled=false; }
  };
}

function findDupes(name, brand){
  const n = norm(name); if(n.length<3) return [];
  const b = norm(brand);
  return S.items.filter(i=>{
    const inn = norm(i.name);
    const nameHit = inn.includes(n) || n.includes(inn);
    return nameHit && (!b || !i.brand || norm(i.brand)===b);
  }).slice(0,4);
}
function updateDupes(){
  const box = $('#f-dupe'); if(!box) return;
  const d = findDupes($('#f-name')?.value, $('#f-brand')?.value);
  if(!d.length){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="dupe"><b>¿Ya está registrado?</b> Si es el mismo, mejor súmale la cantidad en vez de duplicarlo.
    ${d.map(it=>`<div class="dupe-row">

      <button type="button" class="btn sm" data-addto="${it.id}">Sumar aquí</button>
    </div>`).join('')}</div>`;
}
async function saveQuick(){
  const root = $('#view');
  const p = readItemFields(root);
  const err = validateItem(p); if(err){ toast(err, true); return; }
  const btn = $('#qa-save'); btn.disabled = true;
  // coincidencia exacta en la misma ubicación → preguntar
  const exact = S.items.find(i=>norm(i.name)===norm(p.name) && norm(i.brand)===norm(p.brand) && i.locationId===p.locationId && norm(i.spec)===norm(p.spec));
  if(exact){
    const sum = await askConfirm('Ya existe en esa ubicación', `<b>${esc(exact.name)}</b> ya está registrado en ${esc(locName(exact.locationId))} con ${exact.quantity} ${esc(exact.unit||'pza')}. ¿Le sumo ${p.quantity} en vez de crear otro?`, {okLabel:`Sumar ${p.quantity}`});
    if(sum){
      try{ if(p.quantity>0) await recordMovement(exact.id, 'entrada', p.quantity, 'Desde alta rápida'); toast('Cantidad sumada'); resetQuickForm(); }
      catch(e){ toast(errMsg(e), true); }
      btn.disabled=false; return;
    }
  }
  try{
    const ref = doc(collection(db,'items'));
    const b = writeBatch(db);
    const data = {...p, thumb: quickPhoto?.thumb || '', hasPhoto: !!quickPhoto, createdAt:serverTimestamp(), createdBy:S.user.email, updatedAt:serverTimestamp(), updatedBy:S.user.email};
    b.set(ref, data);
    if(quickPhoto) b.set(doc(db,'photos',ref.id), {data: quickPhoto.full});
    b.set(doc(collection(db,'movements')), movementDoc(ref.id, p, 'alta', p.quantity, 0, p.quantity, ''));
    const commit = b.commit();
    // Con caché local, el cambio se ve de inmediato; si no hay internet se sube después.
    await Promise.race([commit, new Promise(r=>setTimeout(r,1500))]);
    commit.catch(e=>toast('No se pudo guardar '+p.name+': '+errMsg(e), true));
    S.session.unshift({id:ref.id, name:p.name, qty:p.quantity, unit:p.unit, thumb:quickPhoto?.thumb||'', cat:p.categoryId});
    toast(`${p.name} guardado`);
    saveQuickCtx();
    resetQuickForm();
    drawSessionList();
  }catch(e){ toast(errMsg(e), true); }
  btn.disabled=false;
}

  quickPhoto = null;

  ['f-name','f-brand','f-spec','f-serial','f-price','f-notes','f-min'].forEach(id=>{ const el=$('#'+id); if(el) el.value=''; });

const MV_LABEL = {alta:'Alta', entrada:'Entrada', salida:'Salida', ajuste:'Ajuste', baja:'Eliminado'};
function mvSentence(h, short){
  const who = `<b>${esc((h.byName||h.byEmail||'').split(' ')[0])}</b>`;
  const n = `<b class="num">${h.qty} ${esc(h.unit||'pza')}</b>`;
  const what = short ? '' : ` de <b>${esc(h.itemName)}</b>`;
  const note = h.note ? ` <span style="color:var(--muted)">— ${esc(h.note)}</span>` : '';
  switch(h.type){
    case 'alta': return `${who} lo dio de alta con ${n}${short?'':`: <b>${esc(h.itemName)}</b>`}${note}`;
    case 'entrada': return `${who} agregó ${n}${what}${note}`;
    case 'salida': return `${who} sacó ${n}${what}${note}`;
    case 'ajuste': return `${who} corrigió la cantidad${what}: ${h.before} → ${h.after}${note}`;
    case 'baja': return `${who} eliminó ${short?'el artículo':`<b>${esc(h.itemName)}</b>`} (tenía ${h.before})`;
  }
  return '';
}
function renderMovements(v){
  v.innerHTML = `
    <div class="page-h"><div><h1>Movimientos</h1><p>Quién agregó o sacó qué, y cuándo.</p></div></div>
    <div class="toolbar">
      <div class="search">${ICONS.search}<input class="input" id="mv-q" placeholder="Buscar artículo" value="${esc(S.mvFilter.q)}"></div>
      <select class="select" id="mv-who" style="width:auto"></select>
      <select class="select" id="mv-type" style="width:auto">
        <option value="">Todos los tipos</option>
        ${Object.entries(MV_LABEL).map(([k,l])=>`<option value="${k}" ${S.mvFilter.type===k?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div id="mv-list"></div>`;
  $('#mv-q').addEventListener('input', e=>{ S.mvFilter.q=e.target.value; renderMovementsList(); });
  $('#mv-who').addEventListener('change', e=>{ S.mvFilter.who=e.target.value; renderMovementsList(); });
  $('#mv-type').addEventListener('change', e=>{ S.mvFilter.type=e.target.value; renderMovementsList(); });
  $('#mv-list').addEventListener('click', e=>{ const r=e.target.closest('[data-open]'); if(r && S.items.some(i=>i.id===r.dataset.open)) openDetail(r.dataset.open); });
  renderMovementsList();
}
function renderMovementsList(){
  const box = $('#mv-list'); if(!box) return;
  const people = [...new Map(S.movements.map(m=>[m.byEmail, m.byName||m.byEmail])).entries()];
  const whoSel = $('#mv-who');
  whoSel.innerHTML = `<option value="">Todas las personas</option>`+people.map(([e,n])=>`<option value="${esc(e)}" ${S.mvFilter.who===e?'selected':''}>${esc(n)}</option>`).join('');
  let list = S.movements;
  if(S.mvFilter.who) list = list.filter(m=>m.byEmail===S.mvFilter.who);
  if(S.mvFilter.type) list = list.filter(m=>m.type===S.mvFilter.type);
  const q = norm(S.mvFilter.q); if(q) list = list.filter(m=>norm(m.itemName).includes(q));
  if(!S.loaded.has('movements')){ box.innerHTML = '<div class="loading" style="min-height:200px"><div class="spin"></div></div>'; return; }
  if(!list.length){ box.innerHTML = `<div class="empty"><h3>Sin movimientos</h3><p>${S.movements.length?'Nada coincide con los filtros.':'Cada alta, entrada o salida que registren aparecerá aquí con el nombre de quien lo hizo.'}</p></div>`; return; }
  let html='', lastDay='';
  for(const m of list){
    const d = tsDate(m.at); const day = fmtDay(d);
    if(day!==lastDay){ html += `<div class="day">${esc(day)}</div>`; lastDay=day; }
    const badge = m.type==='salida' ? ['outb','−'+m.qty] : (m.type==='entrada'||m.type==='alta') ? ['in','+'+m.qty] : m.type==='ajuste' ? ['adj', (m.after-m.before>0?'+':'−')+m.qty] : ['del','×'];
    html += `<div class="mv" data-open="${m.itemId}" style="cursor:pointer">
      <div class="mv-badge ${badge[0]} num">${badge[1]}</div>
      <div class="mv-text">${mvSentence(m)}<div class="sub">${esc(furnName(m.furnitureId))} › ${esc(locName(m.locationId))} · quedan ${m.after}</div></div>
      <div class="mv-time num">${fmtTime(d)}</div>
    </div>`;
  }
  if(S.movements.length>=400) html += `<p class="help" style="text-align:center">Se muestran los 400 movimientos más recientes.</p>`;
  box.innerHTML = html;
}

async function swapOrder(colName, list, id, dir){
  const i = list.findIndex(x=>x.id===id), j = i+dir;
  if(i<0 || j<0 || j>=list.length) return;
  const b = writeBatch(db);
  list.forEach((x,k)=>{ let ord=k; if(k===i) ord=j; else if(k===j) ord=i; if((x.order??-1)!==ord) b.update(doc(db,colName,x.id), {order:ord}); });
  await b.commit();
}
async function configAction(act, id){
  try{
    const f = S.furniture.find(x=>x.id===id), l = S.locations.find(x=>x.id===id), c = S.categories.find(x=>x.id===id);
    if(act==='furn-up' || act==='furn-down') return swapOrder('furniture', sortedFurniture(), id, act==='furn-up'?-1:1);
    if(act==='loc-up' || act==='loc-down') return swapOrder('locations', locsOf(l.furnitureId), id, act==='loc-up'?-1:1);
    if(act==='furn-ren'){ const n = await askText('Renombrar mueble', {value:f.name}); if(n) await updateDoc(doc(db,'furniture',id), {name:n}); return; }
    if(act==='loc-ren'){ const n = await askText('Renombrar ubicación', {value:l.name}); if(n) await updateDoc(doc(db,'locations',id), {name:n}); return; }
    if(act==='cat-ren'){ const n = await askText('Renombrar categoría', {value:c.name}); if(n) await updateDoc(doc(db,'categories',id), {name:n}); return; }
    if(act==='cat-emo'){ const n = await askText('Ícono de la categoría', {value:c.emoji||'', label:'Escribe o pega un emoji', placeholder:'💡'}); if(n) await updateDoc(doc(db,'categories',id), {emoji:[...n][0]||'📦'}); return; }
    if(act==='loc-add'){
      const n = await askText(`Nueva ubicación en ${f.name}`, {placeholder:'p. ej. Cajón 1', okLabel:'Crear ubicación'});
      if(n) await setDoc(doc(collection(db,'locations')), {furnitureId:id, name:n, order:locsOf(id).length, createdAt:serverTimestamp()});
      return;
    }
    if(act==='furn-del'){
      const n = S.items.filter(i=>i.furnitureId===id).length;
      if(n){ toast(`Este mueble tiene ${n} artículos. Muévelos o elimínalos primero.`, true); return; }
      if(!await askConfirm('Eliminar mueble', `¿Eliminar <b>${esc(f.name)}</b> y sus ubicaciones?`, {okLabel:'Eliminar', danger:true})) return;
      const b = writeBatch(db); b.delete(doc(db,'furniture',id)); locsOf(id).forEach(x=>b.delete(doc(db,'locations',x.id))); await b.commit(); toast('Mueble eliminado'); return;
    }
    if(act==='loc-del'){
      const n = S.items.filter(i=>i.locationId===id).length;
      if(n){ toast(`Esta ubicación tiene ${n} artículos. Muévelos primero (Editar datos).`, true); return; }
      if(!await askConfirm('Eliminar ubicación', `¿Eliminar <b>${esc(l.name)}</b>?`, {okLabel:'Eliminar', danger:true})) return;
      await deleteDoc(doc(db,'locations',id)); toast('Ubicación eliminada'); return;
    }
    if(act==='cat-del'){
      const n = S.items.filter(i=>i.categoryId===id).length;
      if(n){ toast(`Hay ${n} artículos en esta categoría. Cámbialos de categoría primero.`, true); return; }
      if(!await askConfirm('Eliminar categoría', `¿Eliminar <b>${esc(c.name)}</b>?`, {okLabel:'Eliminar', danger:true})) return;
      await deleteDoc(doc(db,'categories',id)); toast('Categoría eliminada'); return;
    }
    if(act==='acc-del'){
      if(id===OWNER_EMAIL) return;
      if(!await askConfirm('Quitar acceso', `¿Quitarle el acceso a <b>${esc(id)}</b>?`, {okLabel:'Quitar', danger:true})) return;
      await setDoc(doc(db,'config','access'), {emails:(S.access.emails||[]).filter(e=>e!==id)}, {merge:true}); toast('Acceso quitado'); return;
    }
  }catch(e){ toast(errMsg(e), true); }
}
function exportCsv(){
  const cols = ['Mueble','Ubicación','Categoría','Nombre','Marca','Medida/tipo','Cantidad','Unidad','Mínimo','No. de serie','Precio aprox.','Notas'];
  const rows = S.items.slice().sort((a,b)=>groupSortKey(a).localeCompare(groupSortKey(b)) || a.name.localeCompare(b.name,'es')).map(i=>[
    furnName(i.furnitureId), locName(i.locationId), catLabel(i.categoryId), i.name, i.brand, i.spec, i.quantity, i.unit, i.minStock||'', i.serial, i.price||'', i.notes
  ]);
  const csv = [cols, ...rows].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `inventario-osuna-maruri-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
